# StreamBox en local : docker compose up --build, puis http://localhost:8080
name: streambox-local

services:
  # Génère les vidéos de test une seule fois, dans ./bucket/media.
  medias:
    image: alpine:3.20
    command: ["sh", "/scripts/medias.sh"]
    volumes:
      - ./local/medias.sh:/scripts/medias.sh:ro
      - ./bucket:/bucket

  # Le code à déployer sur Cloud Run.
  catalogue:
    build: ./catalogue
    environment:
      APP_VERSION: local

  # Joue le rôle du Load Balancer, de Cloud CDN et du bucket.
  edge:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./local/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./bucket:/bucket:ro
    depends_on:
      catalogue:
        condition: service_started
      medias:
        condition: service_completed_successfully
