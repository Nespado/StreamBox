name: streambox-monitoring

services:
  exporter:
    image: prometheuscommunity/stackdriver-exporter:v0.19.0
    restart: unless-stopped
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/adc.json
    command:
      - --google.project-ids=${GCP_PROJECT_ID:-streambox-insset-m1-2026}
      - --monitoring.drop-delegated-projects
      - --monitoring.metrics-prefixes=run.googleapis.com/request_count
      - --monitoring.metrics-prefixes=run.googleapis.com/request_latencies
      - --monitoring.metrics-prefixes=run.googleapis.com/container/instance_count
      - --monitoring.metrics-prefixes=loadbalancing.googleapis.com/https/request_count
      - --monitoring.metrics-prefixes=loadbalancing.googleapis.com/https/response_bytes_count
      - --monitoring.metrics-prefixes=loadbalancing.googleapis.com/https/backend_request_count
      - --monitoring.metrics-prefixes=loadbalancing.googleapis.com/https/backend_response_bytes_count
      - '--monitoring.filters=run.googleapis.com:resource.type="cloud_run_revision" AND resource.labels.service_name="${CLOUD_RUN_SERVICE:-streambox-catalogue}" AND resource.labels.location="${GCP_REGION:-europe-west9}"'
      - '--monitoring.filters=loadbalancing.googleapis.com:resource.type="https_lb_rule" AND resource.labels.url_map_name="${LB_URL_MAP:-streambox-url-map}"'
      - --monitoring.metrics-ingest-delay
      - --monitoring.metrics-interval=10m
      - --monitoring.aggregate-deltas
      - --monitoring.aggregate-deltas-ttl=30m
      - --monitoring.descriptor-cache-ttl=1h
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:?Indiquer le chemin absolu du fichier ADC}
        target: /credentials/adc.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:9255:9255"

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Choisir un mot de passe Grafana}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
