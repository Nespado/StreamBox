# Émulation locale de l'Application Load Balancer, de Cloud CDN et du bucket.
# Ce fichier ne se déploie jamais : sur GCP, ces rôles reviennent à l'URL map,
# au backend bucket avec Cloud CDN et à Cloud Storage.

proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn:10m max_size=200m inactive=10m use_temp_path=off;

# Le faux bucket Cloud Storage : il sert les objets tels qu'ils sont rangés dans ./bucket.
# Le débit est volontairement bridé pour que la différence avec le cache se voie.
server {
    listen 8081;
    root /bucket;
    location /media/ {
        limit_rate 256k;
        add_header Cache-Control "public, max-age=60";
    }
}

# Le point d'entrée : l'équivalent de l'URL map.
server {
    listen 80;

    # /media/* : backend bucket derrière le CDN.
    location /media/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_cache cdn;
        proxy_cache_key $uri;
        proxy_cache_valid 200 60s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Tout le reste, API et page d'accueil : backend service vers Cloud Run.
    location / {
        proxy_pass http://catalogue:8080;
        proxy_set_header Host $host;
    }
}
